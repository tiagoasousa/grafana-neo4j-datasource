apiVersion: 1

datasources:
  - name: neo4j
    type: tiagoasousa-neo4j-datasource
    isDefault: true
    jsonData:
      url: neo4j://neo4j:7687
      username: neo4j
    secureJsonData:
      password: Password123

  - name: neo4j-pdc
    type: tiagoasousa-neo4j-datasource
    jsonData:
      url: neo4j://neo4j:7687
      username: neo4j
      enableSecureSocksProxy: true
    secureJsonData:
      password: Password123
