services:
  grafana:
    extends:
      file: .config/docker-compose-base.yaml
      service: grafana
    environment:
      GF_FEATURE_TOGGLES_ENABLE: secureSocksDSProxyEnabled
      # local stand-in for Grafana Cloud's PDC SOCKS endpoint
      GF_SECURE_SOCKS_DATASOURCE_PROXY_ENABLED: "true"
      GF_SECURE_SOCKS_DATASOURCE_PROXY_PROXY_ADDRESS: socks:5555
      GF_SECURE_SOCKS_DATASOURCE_PROXY_ALLOW_INSECURE: "true"
    depends_on:
      - neo4j
      - socks

  socks:
    build: ./dev/socks
    command: ["-i", "0.0.0.0", "-p", "5555"]

  neo4j:
    image: neo4j:5-community
    environment:
      - NEO4J_AUTH=neo4j/Password123
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j-data:/data

  neo4j-provisioning:
    image: neo4j:5-community
    volumes:
      - ./dev/neo4j/seed.cql:/seed.cql
    entrypoint: []
    command: /bin/sh -c 'until cypher-shell -a neo4j://neo4j:7687 -u neo4j -p Password123 "RETURN 1" >/dev/null 2>&1; do sleep 2; done && cypher-shell -a neo4j://neo4j:7687 -u neo4j -p Password123 -f /seed.cql'

volumes:
  neo4j-data:
